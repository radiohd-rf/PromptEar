name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: pip install ruff==0.16.8 mypy==2.3.1 pytest==9.1.1 pytest-mock==3.15.1 requests-mock==1.12.1
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy --ignore-missing-imports --exclude 'build/|dist/|tests/data/' .
      - name: Test
        run: pytest tests/unit/ -v
